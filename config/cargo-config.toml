# The index URL is supplied by the corporate Docker build as a Cargo-supported
# environment variable. A token must only be supplied when the container runs.
[registries.crates-io-mirror]
credential-provider = "cargo:token"

[source.crates-io]
replace-with = "crates-io-mirror"

[registry]
global-credential-providers = ["cargo:token"]

# Retry transient failures from the internal registry. Successful downloads
# remain in Cargo's registry cache and are reused by later attempts.
[net]
retry = 10

[http]
timeout = 120
low-speed-limit = 1
